<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Class - Shubh Classes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .edit-class-page {
            min-height: 100vh;
            background: #f5f7fb;
            padding: 42px;
            box-sizing: border-box;
        }

        .edit-class-container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* HEADER */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-label {
            color: #ff7426;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .page-header h1 {
            margin: 7px 0 0;
            color: #172554;
            font-size: 38px;
            font-weight: 800;
        }

        .page-header p {
            margin: 8px 0 0;
            color: #7c879a;
            font-size: 14px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            background: #172554;
            color: white;
            padding: 12px 19px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: #ff7426;
            transform: translateY(-2px);
        }

        /* CARD */

        .class-card {
            background: white;
            border: 1px solid #e7ebf1;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(23, 37, 84, .07);
        }

        .card-heading {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 25px;
            margin-bottom: 28px;
            border-bottom: 1px solid #edf0f4;
        }

        .heading-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: #fff1e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .card-heading h2 {
            margin: 0;
            color: #172554;
            font-size: 22px;
        }

        .card-heading p {
            margin: 5px 0 0;
            color: #8993a5;
            font-size: 13px;
        }

        /* CLASS INFO */

        .class-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f5f7fb;
            border: 1px solid #e8ecf2;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 25px;
        }

        .class-info-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #eef3ff;
            color: #3157a6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .class-info-text span {
            display: block;
            color: #8993a5;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .class-info-text strong {
            display: block;
            margin-top: 4px;
            color: #172554;
            font-size: 14px;
        }

        /* FORM */

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #344054;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            min-height: 50px;
            padding: 13px 15px;
            border: 1px solid #d9dee8;
            border-radius: 10px;
            background: #fbfcfe;
            color: #172554;
            font-size: 14px;
            outline: none;
            transition: .2s ease;
        }

        .form-group input:focus {
            border-color: #ff7426;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 116, 38, .10);
        }

        .form-group input::placeholder {
            color: #a4acb9;
        }

        .form-hint {
            margin-top: 7px;
            color: #94a3b8;
            font-size: 11px;
        }

        /* ACTIONS */

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #edf0f4;
        }

        .cancel-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 21px;
            border-radius: 10px;
            background: #eef1f6;
            color: #344054;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
        }

        .cancel-btn:hover {
            background: #e2e6ed;
        }

        .update-btn {
            border: none;
            padding: 13px 24px;
            border-radius: 10px;
            background: #ff7426;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 8px 18px rgba(255, 116, 38, .20);
        }

        .update-btn:hover {
            background: #ea641b;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 116, 38, .25);
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .edit-class-page {
                padding: 28px 16px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .class-card {
                padding: 22px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .cancel-btn,
            .update-btn {
                width: 100%;
                box-sizing: border-box;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="edit-class-page">

    <div class="edit-class-container">

        <!-- PAGE HEADER -->

        <div class="page-header">

            <div>

                <div class="page-label">
                    ADMIN PANEL
                </div>

                <h1>
                    Edit Class
                </h1>

                <p>
                    Update the class name and manage class information.
                </p>

            </div>

            <a href="{{ url_for('admin_classes') }}"
               class="back-btn">
                ← Classes
            </a>

        </div>


        <!-- FORM CARD -->

        <div class="class-card">

            <div class="card-heading">

                <div class="heading-icon">
                    🎓
                </div>

                <div>

                    <h2>
                        Class Information
                    </h2>

                    <p>
                        Update the class details below.
                    </p>

                </div>

            </div>


            <!-- CURRENT CLASS -->

            <div class="class-info">

                <div class="class-info-icon">
                    📚
                </div>

                <div class="class-info-text">

                    <span>
                        Current Class
                    </span>

                    <strong>
                        {{ class_data.class_name }}
                    </strong>

                </div>

            </div>


            <!-- FORM -->

            <form method="POST">

                <div class="form-group">

                    <label for="class_name">
                        Class Name
                    </label>

                    <input
                        type="text"
                        id="class_name"
                        name="class_name"
                        value="{{ class_data.class_name }}"
                        placeholder="e.g. Class 10"
                        required>

                    <span class="form-hint">
                        Enter the updated class name.
                    </span>

                </div>


                <!-- ACTIONS -->

                <div class="form-actions">

                    <a href="{{ url_for('admin_classes') }}"
                       class="cancel-btn">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="update-btn">
                        ✓ Update Class
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
