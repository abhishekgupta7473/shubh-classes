<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Teacher - Shubh Classes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .edit-teacher-page {
            min-height: 100vh;
            background: #f5f7fb;
            padding: 42px;
            box-sizing: border-box;
        }

        .edit-container {
            max-width: 950px;
            margin: 0 auto;
        }

        /* HEADER */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-label {
            color: #ff7426;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .page-header h1 {
            margin: 7px 0 0;
            color: #172554;
            font-size: 38px;
            font-weight: 800;
        }

        .page-header p {
            margin: 8px 0 0;
            color: #7c879a;
            font-size: 14px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            background: #172554;
            color: white;
            padding: 12px 19px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: #ff7426;
            transform: translateY(-2px);
        }

        /* CARD */

        .teacher-card {
            background: white;
            border: 1px solid #e7ebf1;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(23, 37, 84, .07);
        }

        .card-heading {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 25px;
            margin-bottom: 28px;
            border-bottom: 1px solid #edf0f4;
        }

        .heading-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: #fff1e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .card-heading h2 {
            margin: 0;
            color: #172554;
            font-size: 22px;
        }

        .card-heading p {
            margin: 5px 0 0;
            color: #8993a5;
            font-size: 13px;
        }

        /* TEACHER ID */

        .teacher-id-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f5f7fb;
            border: 1px solid #e8ecf2;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 25px;
        }

        .teacher-id-box span {
            color: #8993a5;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .teacher-id-box strong {
            color: #3157a6;
            font-size: 13px;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #344054;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            min-height: 47px;
            padding: 13px 14px;
            border: 1px solid #d9dee8;
            border-radius: 10px;
            background: #fbfcfe;
            color: #172554;
            font-size: 14px;
            outline: none;
            transition: .2s ease;
        }

        .form-group input:focus {
            border-color: #ff7426;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 116, 38, .10);
        }

        .form-group input::placeholder {
            color: #a4acb9;
        }

        /* ACTIONS */

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #edf0f4;
        }

        .cancel-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 21px;
            border-radius: 10px;
            background: #eef1f6;
            color: #344054;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
        }

        .cancel-btn:hover {
            background: #e2e6ed;
        }

        .update-btn {
            border: none;
            padding: 13px 24px;
            border-radius: 10px;
            background: #ff7426;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 8px 18px rgba(255, 116, 38, .20);
        }

        .update-btn:hover {
            background: #ea641b;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 116, 38, .25);
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .edit-teacher-page {
                padding: 28px 16px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .teacher-card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .cancel-btn,
            .update-btn {
                width: 100%;
                box-sizing: border-box;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="edit-teacher-page">

    <div class="edit-container">

        <!-- HEADER -->

        <div class="page-header">

            <div>

                <div class="page-label">
                    ADMIN PANEL
                </div>

                <h1>
                    Edit Teacher
                </h1>

                <p>
                    Update teacher profile and professional information.
                </p>

            </div>

            <a href="{{ url_for('teachers') }}"
               class="back-btn">
                ← Teachers
            </a>

        </div>


        <!-- FORM CARD -->

        <div class="teacher-card">

            <div class="card-heading">

                <div class="heading-icon">
                    👨‍🏫
                </div>

                <div>

                    <h2>
                        Teacher Information
                    </h2>

                    <p>
                        Modify the teacher's details below.
                    </p>

                </div>

            </div>


            <!-- TEACHER ID -->

            <div class="teacher-id-box">

                <span>
                    Teacher User ID
                </span>

                <strong>
                    {{ teacher.user_id }}
                </strong>

            </div>


            <!-- FORM -->

            <form method="POST">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            value="{{ teacher.name }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            value="{{ teacher.phone }}"
                            pattern="[0-9]{10}"
                            minlength="10"
                            maxlength="10"
                            inputmode="numeric"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            value="{{ teacher.email }}"
                            placeholder="teacher@example.com">

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            value="{{ teacher.subject }}"
                            placeholder="e.g. Mathematics">

                    </div>


                    <div class="form-group">

                        <label for="qualification">
                            Qualification
                        </label>

                        <input
                            type="text"
                            id="qualification"
                            name="qualification"
                            value="{{ teacher.qualification }}"
                            placeholder="e.g. M.Sc, B.Ed">

                    </div>


                    <div class="form-group">

                        <label for="joining_date">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            id="joining_date"
                            name="joining_date"
                            value="{{ teacher.joining_date }}">

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="form-actions">

                    <a href="{{ url_for('teachers') }}"
                       class="cancel-btn">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="update-btn">
                        ✓ Update Teacher
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
