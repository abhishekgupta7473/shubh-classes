<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Shubh Classes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        /* BACKGROUND */
        .shape {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
        }

        .shape-one {
            width: 420px;
            height: 420px;
            background: #172554;
            left: -230px;
            top: -220px;
        }

        .shape-two {
            width: 350px;
            height: 350px;
            background: #ff7426;
            right: -200px;
            bottom: -200px;
        }

        .shape-three {
            width: 130px;
            height: 130px;
            background: #e8edf6;
            right: 12%;
            top: 10%;
        }

        /* CARD */
        .forgot-card {
            width: 430px;
            max-width: 100%;
            background: white;
            border-radius: 25px;
            padding: 38px;
            position: relative;
            z-index: 2;
            border: 1px solid #e5e7eb;
            box-shadow: 0 25px 65px rgba(15, 23, 42, 0.14);
        }

        /* ICON */
        .forgot-icon {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: #172554;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 22px;
            box-shadow: 0 10px 25px rgba(23, 37, 84, 0.18);
        }

        .top-label {
            color: #ff7426;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 7px;
        }

        h1 {
            color: #172554;
            font-size: 28px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 27px;
        }

        /* MESSAGES */
        .message {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .success-message {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        /* FORM */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #dbe2ea;
            border-radius: 11px;
            background: #f8fafc;
            color: #172554;
            font-size: 14px;
            outline: none;
            transition: .2s;
        }

        select:focus,
        input:focus {
            background: white;
            border-color: #ff7426;
            box-shadow: 0 0 0 3px rgba(255, 116, 38, 0.11);
        }

        /* BUTTON */
        .change-btn {
            width: 100%;
            height: 51px;
            border: none;
            border-radius: 11px;
            background: #ff7426;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
            margin-top: 4px;
        }

        .change-btn:hover {
            background: #ea641b;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 116, 38, 0.25);
        }

        /* BACK */
        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            padding-top: 19px;
            border-top: 1px solid #eef2f7;
            color: #172554;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .back-login:hover {
            color: #ff7426;
        }

        .security {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 17px;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .forgot-card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>

    <div class="forgot-card">

        <div class="forgot-icon">
            🔐
        </div>

        <div class="top-label">
            ACCOUNT SECURITY
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your account details and choose a new password.
        </p>


        {% if error %}
            <div class="message error-message">
                {{ error }}
            </div>
        {% endif %}


        {% if success %}
            <div class="message success-message">
                {{ success }}
            </div>
        {% endif %}


        <form method="POST" action="/forgot-password">

            <div class="form-group">

                <label for="role">
                    Login As
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >
                    <option value="student">
                        Student
                    </option>

                    <option value="teacher">
                        Teacher
                    </option>

                    <option value="admin">
                        Admin
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label for="user_id">
                    User ID
                </label>

                <input
                    type="text"
                    id="user_id"
                    name="user_id"
                    placeholder="Enter your User ID"
                    required
                >

            </div>


            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >

            </div>


            <button
                type="submit"
                class="change-btn"
            >
                Change Password →
            </button>

        </form>


        <a href="/login"
           class="back-login">
            ← Back to Login
        </a>


        <div class="security">
            🔒 Secure account recovery · Shubh Classes
        </div>

    </div>

</body>
</html>
