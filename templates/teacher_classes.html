<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Classes - Shubh Classes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .classes-page {
            min-height: 100vh;
            background: #f5f7fb;
            padding: 42px;
            box-sizing: border-box;
        }

        .classes-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* HEADER */

        .classes-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-label {
            color: #ff7426;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .classes-header h1 {
            margin: 7px 0 0;
            color: #172554;
            font-size: 38px;
            font-weight: 800;
        }

        .classes-header p {
            margin: 8px 0 0;
            color: #7c879a;
            font-size: 14px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            background: #172554;
            color: white;
            padding: 12px 19px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: #ff7426;
            transform: translateY(-2px);
        }

        /* CLASS GRID */

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .class-card {
            background: white;
            border: 1px solid #e7ebf1;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(23, 37, 84, .06);
            transition: .2s ease;
        }

        .class-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 35px rgba(23, 37, 84, .10);
            border-color: #dce2eb;
        }

        .class-icon {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            background: #fff1e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 18px;
        }

        .class-card h2 {
            margin: 0;
            color: #172554;
            font-size: 21px;
        }

        .class-card p {
            margin: 7px 0 0;
            color: #8993a5;
            font-size: 13px;
        }

        .class-badge {
            display: inline-block;
            margin-top: 18px;
            padding: 6px 10px;
            border-radius: 8px;
            background: #eef3ff;
            color: #3157a6;
            font-size: 11px;
            font-weight: 800;
        }

        /* EMPTY */

        .empty-card {
            background: white;
            border: 1px solid #e7ebf1;
            border-radius: 20px;
            padding: 65px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(23, 37, 84, .06);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-card h2 {
            margin: 0;
            color: #172554;
        }

        .empty-card p {
            margin-top: 8px;
            color: #8993a5;
            font-size: 14px;
        }

        /* FOOTER */

        .page-footer {
            margin-top: 28px;
            display: flex;
            justify-content: flex-end;
        }

        .logout-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            background: #eef1f6;
            color: #344054;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
        }

        .logout-btn:hover {
            background: #feecec;
            color: #d14343;
        }

        /* MOBILE */

        @media (max-width: 850px) {

            .classes-page {
                padding: 28px 16px;
            }

            .classes-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .classes-header h1 {
                font-size: 30px;
            }

            .classes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {

            .classes-grid {
                grid-template-columns: 1fr;
            }

            .page-footer {
                justify-content: stretch;
            }

            .logout-btn {
                width: 100%;
                justify-content: center;
                box-sizing: border-box;
            }
        }

    </style>
</head>

<body>

<div class="classes-page">

    <div class="classes-container">

        <!-- HEADER -->

        <div class="classes-header">

            <div>

                <div class="page-label">
                    TEACHER PANEL
                </div>

                <h1>
                    My Classes
                </h1>

                <p>
                    View the classes assigned to you.
                </p>

            </div>

            <a href="{{ url_for('teacher_dashboard') }}"
               class="back-btn">
                ← Dashboard
            </a>

        </div>


        <!-- CLASSES -->

        {% if classes %}

            <div class="classes-grid">

                {% for item in classes %}

                    <div class="class-card">

                        <div class="class-icon">
                            📚
                        </div>

                        <h2>
                            {{ item.class_name }}
                        </h2>

                        <p>
                            Assigned teaching class
                        </p>

                        <span class="class-badge">
                            MY CLASS
                        </span>

                    </div>

                {% endfor %}

            </div>

        {% else %}

            <div class="empty-card">

                <div class="empty-icon">
                    📚
                </div>

                <h2>
                    No Classes Assigned
                </h2>

                <p>
                    No classes have been assigned to you yet.
                </p>

            </div>

        {% endif %}


    </div>

</div>

</body>
</html>
