<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Class - Shubh Classes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .class-page {
            min-height: 100vh;
            background: #f5f7fb;
            padding: 42px;
            box-sizing: border-box;
        }

        .class-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-label {
            color: #ff7426;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .page-header h1 {
            margin: 7px 0 0;
            color: #172554;
            font-size: 38px;
            font-weight: 800;
        }

        .page-header p {
            margin: 8px 0 0;
            color: #7c879a;
            font-size: 14px;
        }

        .back-btn {
            text-decoration: none;
            background: #172554;
            color: white;
            padding: 12px 19px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
        }

        .back-btn:hover {
            background: #ff7426;
            transform: translateY(-2px);
        }

        .class-card {
            background: white;
            border: 1px solid #e7ebf1;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(23, 37, 84, .07);
        }

        .card-heading {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 24px;
            margin-bottom: 25px;
            border-bottom: 1px solid #edf0f4;
        }

        .heading-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: #fff1e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .card-heading h2 {
            margin: 0;
            color: #172554;
            font-size: 22px;
        }

        .card-heading p {
            margin: 5px 0 0;
            color: #8993a5;
            font-size: 13px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 800;
        }

        input {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid #dbe2ea;
            border-radius: 11px;
            background: #f8fafc;
            color: #172554;
            font-size: 15px;
            outline: none;
            transition: .2s;
        }

        input::placeholder {
            color: #a0a9b8;
        }

        input:focus {
            background: white;
            border-color: #ff7426;
            box-shadow: 0 0 0 3px rgba(255, 116, 38, .12);
        }

        .form-hint {
            margin-top: 7px;
            color: #94a3b8;
            font-size: 11px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #edf0f4;
        }

        .cancel-btn {
            display: inline-block;
            padding: 13px 20px;
            border-radius: 10px;
            border: 1px solid #dbe2ea;
            background: white;
            color: #475569;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .submit-btn {
            padding: 13px 24px;
            border: none;
            border-radius: 10px;
            background: #ff7426;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        .submit-btn:hover {
            background: #ea641b;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(255, 116, 38, .25);
        }

        @media (max-width: 600px) {
            .class-page {
                padding: 28px 16px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .class-card {
                padding: 22px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .cancel-btn,
            .submit-btn {
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

<div class="class-page">

    <div class="class-container">

        <!-- HEADER -->

        <div class="page-header">

            <div>
                <div class="page-label">
                    ADMINISTRATION
                </div>

                <h1>
                    Add New Class
                </h1>

                <p>
                    Create a class for your coaching management system.
                </p>
            </div>

            <a href="{{ url_for('admin_classes') }}"
               class="back-btn">
                ← Classes
            </a>

        </div>


        <!-- FORM CARD -->

        <div class="class-card">

            <div class="card-heading">

                <div class="heading-icon">
                    🎓
                </div>

                <div>
                    <h2>
                        Class Information
                    </h2>

                    <p>
                        Enter the name or number of the new class.
                    </p>
                </div>

            </div>


            <form method="POST">

                <div class="form-group">

                    <label for="class_name">
                        Class Name
                    </label>

                    <input
                        type="text"
                        id="class_name"
                        name="class_name"
                        placeholder="e.g. 10"
                        required
                    >

                    <span class="form-hint">
                        Example: 9, 10, 11, 12
                    </span>

                </div>


                <div class="form-actions">

                    <a href="{{ url_for('admin_classes') }}"
                       class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit"
                            class="submit-btn">
                        Add Class →
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
