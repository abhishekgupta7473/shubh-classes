<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Profile - Shubh Classes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .profile-page {
            min-height: 100vh;
            background: #f5f7fb;
            padding: 45px 25px;
            box-sizing: border-box;
        }

        .profile-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
        }

        .profile-label {
            color: #ff7428;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .profile-header h1 {
            margin: 7px 0 0;
            color: #172744;
            font-size: 38px;
            font-weight: 800;
        }

        .profile-header p {
            margin: 8px 0 0;
            color: #7c879a;
            font-size: 14px;
        }

        .dashboard-btn {
            text-decoration: none;
            background: #172744;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s ease;
        }

        .dashboard-btn:hover {
            background: #ff7428;
            transform: translateY(-2px);
        }

        .profile-card {
            background: white;
            border: 1px solid #e7ebf1;
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(23, 39, 68, .08);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 28px;
            border-bottom: 1px solid #edf0f4;
            margin-bottom: 28px;
        }

        .profile-avatar {
            width: 75px;
            height: 75px;
            border-radius: 20px;
            background: #172744;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 8px 20px rgba(23, 39, 68, .15);
        }

        .profile-top h2 {
            margin: 0;
            color: #172744;
            font-size: 25px;
        }

        .profile-top span {
            display: inline-block;
            margin-top: 6px;
            padding: 6px 10px;
            border-radius: 7px;
            background: #fff1e8;
            color: #e76520;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .detail-box {
            padding: 19px;
            border-radius: 13px;
            background: #f8f9fc;
            border: 1px solid #e8ebf1;
        }

        .detail-box.full {
            grid-column: 1 / -1;
        }

        .detail-label {
            display: block;
            color: #8993a5;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .7px;
            margin-bottom: 7px;
        }

        .detail-value {
            color: #172744;
            font-size: 15px;
            font-weight: 700;
            word-break: break-word;
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 25px;
            border-top: 1px solid #edf0f4;
        }

        .logout-btn {
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            background: #fff0f1;
            color: #d64545;
            font-size: 13px;
            font-weight: 700;
        }

        .logout-btn:hover {
            background: #ffe1e3;
        }

        @media (max-width: 650px) {
            .profile-page {
                padding: 25px 15px;
            }

            .profile-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-header h1 {
                font-size: 30px;
            }

            .profile-card {
                padding: 22px;
            }

            .profile-details {
                grid-template-columns: 1fr;
            }

            .detail-box.full {
                grid-column: auto;
            }

            .profile-top {
                align-items: flex-start;
            }

            .profile-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="profile-page">

    <div class="profile-container">

        <!-- HEADER -->
        <div class="profile-header">

            <div>
                <div class="profile-label">TEACHER PANEL</div>

                <h1>My Profile</h1>

                <p>
                    View your account and professional information.
                </p>
            </div>

            <a href="{{ url_for('teacher_dashboard') }}"
               class="dashboard-btn">
                ← Dashboard
            </a>

        </div>


        <!-- PROFILE CARD -->
        <div class="profile-card">

            <div class="profile-top">

                <div class="profile-avatar">
                    👨‍🏫
                </div>

                <div>
                    <h2>{{ teacher.name }}</h2>

                    <span>
                        {{ teacher.role }}
                    </span>
                </div>

            </div>


            <!-- DETAILS -->
            <div class="profile-details">

                <div class="detail-box">

                    <span class="detail-label">
                        User ID
                    </span>

                    <div class="detail-value">
                        {{ teacher.user_id }}
                    </div>

                </div>


                <div class="detail-box">

                    <span class="detail-label">
                        Role
                    </span>

                    <div class="detail-value">
                        {{ teacher.role }}
                    </div>

                </div>


                <div class="detail-box">

                    <span class="detail-label">
                        Email Address
                    </span>

                    <div class="detail-value">
                        {{ teacher.email }}
                    </div>

                </div>


                <div class="detail-box">

                    <span class="detail-label">
                        Phone Number
                    </span>

                    <div class="detail-value">
                        {{ teacher.phone }}
                    </div>

                </div>

            </div>


            <!-- ACTIONS -->
            <div class="profile-actions">

                <a href="{{ url_for('teacher_dashboard') }}"
                   class="dashboard-btn">
                    ← Back to Dashboard
                </a>

                <a href="{{ url_for('logout') }}"
                   class="logout-btn">
                    Logout
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
